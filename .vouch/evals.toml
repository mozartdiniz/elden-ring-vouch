# Agent routing evals (§7.2). A model is in the loop, so this is a rate:
#
#   vouch eval --agent 'claude -p --allowedTools "" -- {prompt}' -n 5 --min-rate 0.8

# The plain path: resolve the name, then price the weapon.
[[eval]]
ask = "what does a fully upgraded Longsword hit for at 20 strength and 13 dexterity?"
expect_node = "attack-power"
expect_params = { weapon = "Longsword", upgrade = 25 }
attest = true

# The weapon from the question this collection was built for. Somber, so +10 and Standard —
# an agent that reaches for +25 or an affinity has skipped weapon-lookup. The build is
# described by two stats, so the other three have to come from character-build rather than
# from the agent: the first live run of this case invented a dexterity and quoted it back.
[[eval]]
ask = "I'm building strength and faith at RL150 around Ordovis's Greatsword. What does it hit for two-handed at 60 strength and 60 faith?"
expect_node = "character-build"
attest = true

[[eval]]
ask = "what rune level is a Hero with 60 strength and 60 faith, and what is the best class for those stats?"
expect_node = "character-build"
expect_params = { starting_class = "Hero", strength = 60, faith = 60 }
attest = true

# A misspelled somber weapon: the lookup has to resolve it *and* supply the +10 cap.
[[eval]]
ask = "is rivers of blood worth using at 50 arcane and 40 dexterity?"
expect_node = "weapon-lookup"
attest = true

# Ambiguity. Ten weapons contain both words, so the honest end is to ask which was meant
# rather than pricing one of them.
[[eval]]
ask = "how good is the knight sword?"
expect_node = "weapon-lookup"
expect_params = { query = "knight sword" }
expect_stop = true

# Thirteen comparisons against a target's defences: the question a model answers from vibes,
# and the one where "Heavy for strength builds" is folk wisdom that the numbers disagree with.
[[eval]]
ask = "what affinity should I put on my Zweihander? I'm 60 strength, two-handing it."
expect_node = "optimal-affinity"
expect_params = { weapon = "Zweihander", two_hand = true }
attest = true

# Two catalysts, one spell: the comparison needs a call each, and the staff that wins here is
# the one whose +25 cap this collection originally got wrong.
[[eval]]
ask = "I'm at 80 intelligence. What does Comet hit for from a Carian Regal Scepter, and is Lusat's better?"
expect_node = "spell-power"
expect_params = { spell = "Comet" }
attest = true

# Three things called "defence" and they are not interchangeable. An answer that quotes a
# negation percentage as though it were a defence number has flattened the useful part.
[[eval]]
ask = "how tanky is a Vagabond in the full Knight set at 40 vigor? What does it resist?"
expect_node = "defence"
expect_params = { starting_class = "Vagabond", vigor = 40 }
attest = true

# The question this collection was extended for. It needs a boss's own numbers, not a generic
# ranking: against Rennala's first phase the physical infusion wins, and against the reference
# target it does not. An agent that answers without calling boss-lookup gets it wrong.
[[eval]]
ask = "I'm fighting Rennala's first phase with a Longsword at 60 strength and 60 faith. What should I infuse it with?"
expect_node = "boss-lookup"
attest = true

[[eval]]
ask = "does bleed work on Rennala, and what is she weakest to?"
expect_node = "boss-lookup"
attest = true

# Nine of them, 3442 to 28905 health. An answer that gives one number has picked an encounter
# for the user; the honest move is to ask where they are.
[[eval]]
ask = "how much health does the Death Rite Bird have?"
expect_node = "boss-lookup"
expect_stop = true

[[eval]]
ask = "what does wearing Radagon's Soreseal and the Blue Dancer Charm together give me?"
expect_node = "item-effect"
expect_params = { items = ["Radagon's Soreseal", "Blue Dancer Charm"] }
attest = true

# The question shape every real one takes: give me the spread. It needs a class, a weapon, a
# level and floors the agent must ask for or declare rather than invent.
[[eval]]
ask = "Quero fazer uma build de Rivers of Blood no nível 150, assumindo classe Samurai. Monta a distribuição de status pra mim."
expect_node = "build-allocate"
attest = true

# A build that does not fit the level is answered with what it would cost, not refused.
[[eval]]
ask = "Can I make a Rivers of Blood build at rune level 40 as an Astrologer with 40 vigor?"
expect_node = "build-allocate"
attest = true

# The full shape of the first real question: a weapon, a level, a class, and a skill focus.
# The honest answer needs weapon-skill to say whether the skill keeps the weapon's scaling.
[[eval]]
ask = "Quero fazer uma build de Rivers of Blood no nível 150, foco em Corpse Piler, classe Samurai. Monta a distribuição de status pra mim."
expect_node = "build-allocate"
attest = true

[[eval]]
ask = "Does Ground Slam scale off the weapon, or off something else?"
expect_node = "weapon-skill"
expect_params = { query = "Ground Slam" }
attest = true

# Squarely outside the collection: nothing here knows where anything is, and a model asked
# this without tools will happily invent a location.
[[eval]]
ask = "where do I find the Blasphemous Blade?"
expect_stop = true
