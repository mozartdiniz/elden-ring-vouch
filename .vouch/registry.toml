name = "elden-ring"
description = "Elden Ring build maths — attack rating, scaling, requirements and status buildup — computed from the extracted Build Planner spreadsheet tables."

notes = [
  "When the user asks for a stat spread — 'monta a distribuição', 'give me the allocation', 'how do I level for this weapon' — call build-allocate. It is the only node that decides how to spend points; everything else reports on a spread somebody already chose.",
  "build-allocate needs vigor, mind and endurance floors, and it will not invent them. They are a judgement: ask the user, or state the figures you assumed and say they were assumed. Everything above the floors is computed.",
  "When the build carries anything besides the weapon being optimised — a greatshield, a second katana, a seal — pass its requirements as build-allocate's stat_floors. The Fingerprint Stone Shield needs 48 strength and a spread that ignores it cannot hold the shield the question was about. Those floors are data from weapon-lookup, not a judgement like the survivability ones.",
  "build-allocate maximises base weapon attack or a status bar, never skill damage. When the user names a skill, call weapon-skill and check `overrides_weapon_scaling`: false means the weapon's spread applies to the skill too and you can say so, true means the skill scales off a different stat and the spread is not optimal for it.",
  "A caster build is focus = 'spell' with the spell named and the catalyst passed as the weapon: it maximises what the spell hits for, which is not what the catalyst hits for. A Dragon Communion Seal casting Rotten Breath at RL150 wants faith 43 and arcane 68, a split no rule of thumb produces. The spell's own requirements become floors, so the build can cast what it was built for.",
  "weapon-skill reports what a skill is; it does not price it. Its motion values go to optimal-affinity's attack_mv when you need damage for a specific hit.",
  "When the user describes a build by only some of its stats, call character-build first. attack-power needs all five combat stats, and the unnamed ones are the starting class's minimums — real numbers, not ones you pick. Never invent a stat to fill an argument.",
  "character-build reports stats_from_class_minimum and stats_raised_to_class_minimum. Both are figures the user did not choose, so say so rather than presenting them as part of their build.",
  "Call weapon-lookup first for any question naming a weapon, even one spelled correctly. It returns the exact catalogue name, and the two bounds attack-power cannot check for itself: max_upgrade and infusable. Pass both on.",
  "More than one candidate from weapon-lookup is not a list to choose from. Ask the user which weapon they meant; do not price the first one.",
  "A weapon whose infusable is false takes Standard only. Asking for any other affinity on it silently prices the Standard version — the result says affinity_ignored, and quoting the affinity you asked for would be wrong.",
  "Upgrade caps are +25 for smithing-stone weapons, +10 for somber, and +0 for weapons that cannot be reinforced. Always pass max_upgrade from weapon-lookup, or an impossible upgrade level is only caught after the fact.",
  "When a question names an enemy, call boss-lookup first and pass a phase's `defence` and `negation` into optimal-affinity. Without them the ranking is against a generic reference and can simply be the wrong answer: Rennala's first phase has -10 physical negation and 80% magic, so the infusion that wins generally is not the one that wins against her.",
  "A fight has phases, and boss-lookup returns all of them with their own figures. Report per phase: Rennala's first phase has 3493 health and no poise, her second 4097 and 80 poise, and her bubble blocks everything. One number for a multi-phase boss is an answer about a fight that does not exist.",
  "What is still ambiguous is which boss. Forty-seven names in the table are used in more than one place — there are nine Death Rite Birds from 3442 to 28905 health — and when `locations` comes back populated, ask the user where they are rather than choosing.",
  "A boss immune to a status is immune, not merely resistant. boss-lookup reports that per phase in `immune_to`, and no amount of buildup changes it.",
  "When the user names talismans, crystal tears or great runes, call item-effect with all of them at once. It returns the combined effect — stats summed, multipliers multiplied — so you never do that arithmetic. Its `attack_multiplier` is already shaped for optimal-affinity's `damage_multiplier`.",
  "No node applies talisman or tear effects automatically. character-build, equip-load and defence all report figures before them, so say a figure is unbuffed, or add the stat bonuses item-effect returned and say you did.",
  "For how much a build takes, call defence: per-element defences from stats, damage negation from armour, and the four status resistances. Those are three different things and are not interchangeable — negation is a percentage from armour, defence is a flat number from stats, and resistances are status bars that negation does not touch.",
  "Physical negation splits into strike, slash and pierce, and a set good against one is often poor against another. Quote the split rather than one physical number when the question is about a specific enemy.",
  "For armour and rolling, call equip-load with the build's endurance. It does not model talisman effects at all — Great-Jar's Arsenal and Erdtree's Favor raise equip load and are not counted — so say the figure is before talismans whenever that could change the answer.",
  "attack-power reports a missed requirement as a shortfall as well as a flag: quote `shortfall` for 'you need N more points' rather than subtracting the requirement from the stat. It is measured against the effective stat, so two-handing is already in it.",
  "Never do arithmetic on what a node returned — not even a subtraction or a truncation. Quote attack_shown and total_ar_rounded for displayed figures, and pass target_level to character-build so the levels left over come back as a number. A figure you worked out yourself is one no node produced.",
  "When the question is which weapon rather than how good one weapon is — 'quais as armas mais fortes que consigo usar', 'best colossal weapon for 66 strength', 'melhores katanas pra mim' — call weapon-rank. Never assemble a ranking from attack-power calls, and never from memory: it prices all 489 weapons at once and drops the ones the build cannot hold.",
  "weapon-rank ranks on attack rating, which ignores status buildup, reach, moveset and the ash of war. It returns each row's status and guard figures so an answer can say what it left out — a bleed weapon and a greatshield are not chosen on attack rating.",
  "For which spells to use — 'melhores incantations de fogo', 'best Night sorceries' — call spell-rank with the catalyst. damage_type is what the spell deals; family is what a catalyst boosts. They are different filters and the second comes from the ontology's table, not the spreadsheet.",
  "A staff casts sorceries and a seal casts incantations. Pass spell-power both catalyst_class and spell_type when you have them: Comet from an Erdtree Seal prices at 798.766 and is not a cast that exists. The Staff of the Great Beyond casts both, which is why the check reads the game's flags rather than the weapon class.",
  "For 'what should I infuse this with', call optimal-affinity rather than attack-power thirteen times. It ranks every affinity the weapon can take in one call, and reports the margin — a two-damage gap is a coin toss and should be said to be one.",
  "optimal-affinity scores against a target. Without real defences it uses a standard reference and says target=default; say so too. Never invent an enemy's defences to make a ranking look specific.",
  "For spells, call spell-power with the catalyst weapon-lookup resolved, and pass its weapon_class and max_upgrade. Catalyst upgrade caps are not guessable: the Academy and Carian Glintstone staves reach +25 while taking no affinity, and the Carian Regal Scepter stops at +10.",
  "A charged cast is a different spell with a different attack. spell-power reports every form of a spell it was asked about; say which one the figure is for.",
  "A spell's attack is per damage type, and spell-power returns the split: an incantation deals fire, lightning or holy rather than magic, and Meteorite deals physical and magic at once. Quote the type with the figure — a number alone cannot be checked against an enemy's negation.",
  "Comparing weapons means calling attack-power once per weapon on the same stats, then ranking what came back. Say what you ranked on: total_ar alone ignores status buildup, reach, and whether the build meets the requirements.",
  "Every figure is for the stat spread you passed. Two-handing changes strength, so a one-handed and a two-handed answer are different questions — say which one you computed.",
  "These numbers come from the Build Planner spreadsheet at patch 1.19.1, not from the live game.",
]
