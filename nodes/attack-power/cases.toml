# --- what the oracle does not check -------------------------------------------------

# `ap_calc.py` computes this happily and returns 180.39 — an attack rating for an upgrade
# level Moonveil does not have, and lower than the 643 it really reaches at its +10 cap, so it
# does not even look wrong. With the cap declared it is a refusal that says what to do.
[[case]]
name = "an upgrade past the weapon's cap is refused when the cap is declared"
input = { weapon = "Moonveil", affinity = "Standard", upgrade = 25, max_upgrade = 10, strength = 20, dexterity = 20, intelligence = 60, faith = 10, arcane = 10 }
expect_code = 11

# And a caller who declares a generous cap to get past that refusal is caught by the
# postcondition, which uses the cap the node looked up itself. No value reaches stdout.
[[case]]
name = "a wrong declared cap is caught after the fact instead"
input = { weapon = "Moonveil", affinity = "Standard", upgrade = 25, max_upgrade = 25, strength = 20, dexterity = 20, intelligence = 60, faith = 10, arcane = 10 }
expect_code = 13

[[case]]
name = "an affinity on a non-infusable weapon is applied as Standard, and says so"
input = { weapon = "Moonveil", affinity = "Heavy", upgrade = 10, strength = 20, dexterity = 20, intelligence = 60, faith = 10, arcane = 10 }
expect = { "result.affinity_applied" = "Standard", "result.affinity_ignored" = true, "result.infusable" = false }

[[case]]
name = "an unknown affinity is refused with the thirteen names"
input = { weapon = "Longsword", affinity = "Frostbite", upgrade = 25, strength = 20, dexterity = 20, intelligence = 10, faith = 10, arcane = 10 }
expect_code = 11

[[case]]
name = "a stat above 99 is refused rather than computed"
input = { weapon = "Longsword", affinity = "Standard", upgrade = 25, strength = 150, dexterity = 20, intelligence = 10, faith = 10, arcane = 10 }
expect_code = 11

[[case]]
name = "a weapon that cannot be reinforced reports a cap of zero"
input = { weapon = "Meteorite Staff", affinity = "Standard", upgrade = 0, strength = 20, dexterity = 20, intelligence = 60, faith = 10, arcane = 10 }
expect = { "result.max_upgrade" = 0, "result.infusable" = false }

# Added after an eval run quoted "259 holy" from a 259.576275 — the displayed figure, which no
# node had returned, and which attestation refused because 259.576275 rounds to 260.
[[case]]
name = "the displayed per-element figures are returned, not left to the caller"
input = { weapon = "Ordovis's Greatsword", affinity = "Standard", upgrade = 10, strength = 60, dexterity = 13, intelligence = 10, faith = 60, arcane = 9 }
expect = { "result.attack_shown.holy" = 259, "result.attack_shown.physical" = 549, "result.total_ar_rounded" = 809 }

# The guard half of the answer, which was incomplete until guard_resist was returned.
# Prometheux: Longsword Standard +25 blocks 45 physical, 30 elemental, boost 36, and resists
# 15 of every status.
[[case]]
name = "a Longsword's guard figures (Prometheux: 45/30, boost 36, resist 15)"
input = { weapon = "Longsword", affinity = "Standard", upgrade = 25, strength = 20, dexterity = 13, intelligence = 80, faith = 7, arcane = 9 }
expect = { "result.guard_negation.physical" = 45.0, "result.guard_negation.magic" = 30.0, "result.guard_boost" = 36, "result.guard_resist.poison" = 15, "result.guard_resist.bleed" = 15, "result.guard_resist.madness" = 15 }

# The intermittent an eval chased for several runs before the failure report started showing
# the words around an unattested numeral: "you'd need 2 more points", computed by the agent
# from a requirement of 12 and a strength of 10.
[[case]]
name = "a missed requirement reports the gap, not just the verdict"
input = { weapon = "Rivers of Blood", affinity = "Standard", upgrade = 10, strength = 10, dexterity = 40, intelligence = 10, faith = 10, arcane = 50 }
expect = { "result.scaling.strength.requirement" = 12, "result.scaling.strength.effective" = 10, "result.scaling.strength.shortfall" = 2, "result.scaling.strength.req_met" = false, "result.requirements_met" = false }

# Two-handing raises effective strength, so the same build meets the requirement and the
# shortfall goes to zero. The gap is measured against the effective stat, not the raw one.
[[case]]
name = "two-handing closes the gap, and the shortfall says so"
input = { weapon = "Rivers of Blood", affinity = "Standard", upgrade = 10, strength = 10, dexterity = 40, intelligence = 10, faith = 10, arcane = 50, two_hand = true }
expect = { "result.scaling.strength.effective" = 15, "result.scaling.strength.shortfall" = 0, "result.requirements_met" = true }

# --- the spreadsheet's own saved builds.
#
# Three default builds exported from the Build Planner itself, read off the sheet rather than
# computed here. Every other fixture in this collection traces to the extraction; these trace
# to the thing the extraction was made from, which is as close to a hand-check as it gets.

# "[Default] PvP - Faith RL150" — Confessor, VIG 60 / MND 13 / END 25 / STR 15 / DEX 24 /
# INT 9 / FTH 79 / ARC 9. The sheet shows 387.07 physical, 292.32 holy, 679.39 total.
[[case]]
name = "the sheet's faith build: Treespear +25"
input = { weapon = "Treespear", affinity = "Standard", upgrade = 25, strength = 15, dexterity = 24, intelligence = 9, faith = 79, arcane = 9 }
expect = { "result.attack.physical" = 387.0742062404928, "result.attack.holy" = 292.31856500000004, "result.total_ar" = 679.3927712404928, "result.attack_shown.physical" = 387, "result.attack_shown.holy" = 292 }

# "[Default] PvE - Strength RL150" — dexterity 17 on the sheet is 12 levelled plus Millicent's
