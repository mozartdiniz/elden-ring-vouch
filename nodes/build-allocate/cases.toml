# Node fixtures (§7.1).
#
# The figures are the oracle's: this node prices every candidate spread with the same
# `ap_calc` that `attack-power` uses, so a spread's AR here and there are the same number.
# `result.total_ar` below was checked against a separate attack-power call on the same stats.

# The question this node was built for, in the form it was actually asked:
# "Quero fazer uma build de Rivers of Blood no nível 150 ... assumindo classe Samurai."
[[case]]
name = "Rivers of Blood, Samurai, RL150, bleed"
input = { weapon = "Rivers of Blood", affinity = "Standard", upgrade = 10, max_upgrade = 10, starting_class = "Samurai", target_level = 150, focus = "bleed", vigor = 40, mind = 20, endurance = 25 }
expect = { "result.level" = 150, "result.feasible" = true, "result.minimum_level" = 73, "result.stats.arcane" = 97, "result.stats.dexterity" = 18, "result.stats.vigor" = 40, "result.requirements_met" = true, "result.total_ar" = 644.7479977404165, "result.status_shown.bleed" = 79 }

# The focus is not decoration: maximising raw attack on the same weapon at the same level
# produces a different character — 56 dexterity and 59 arcane instead of 97 arcane.
[[case]]
name = "the same weapon and level, maximising attack instead"
input = { weapon = "Rivers of Blood", affinity = "Standard", upgrade = 10, max_upgrade = 10, starting_class = "Samurai", target_level = 150, focus = "attack", vigor = 40, mind = 20, endurance = 25 }
expect = { "result.level" = 150, "result.stats.dexterity" = 56, "result.stats.arcane" = 59, "result.total_ar_rounded" = 675, "result.objective_value" = 675.8263313986536 }

# A build that does not fit is answered, not refused: "that needs RL79" is what the user
# needs to hear, and the spread returned is the cheapest one that works.
[[case]]
name = "a target level too low reports what the build really costs"
input = { weapon = "Rivers of Blood", affinity = "Standard", upgrade = 10, starting_class = "Astrologer", target_level = 40, focus = "bleed", vigor = 40, mind = 20, endurance = 25 }
expect = { "result.feasible" = false, "result.minimum_level" = 79, "result.level" = 79 }

# Two-handing lowers the strength a weapon demands, which frees points for everything else.
[[case]]
name = "two-handing frees the points a strength requirement was taking"
input = { weapon = "Great Stars", affinity = "Standard", upgrade = 25, max_upgrade = 25, starting_class = "Hero", target_level = 150, focus = "bleed", vigor = 40, mind = 15, endurance = 25, two_hand = true }
expect = { "result.stats.strength" = 16, "result.two_hand" = true }

[[case]]
name = "one-handing the same build pays the full requirement"
input = { weapon = "Great Stars", affinity = "Standard", upgrade = 25, max_upgrade = 25, starting_class = "Hero", target_level = 150, focus = "bleed", vigor = 40, mind = 15, endurance = 25 }
expect = { "result.stats.strength" = 22, "result.two_hand" = false }

# The floors are the caller's and are never spent below, and the result says whose they were.
[[case]]
name = "the caller's floors are honoured and echoed"
input = { weapon = "Rivers of Blood", affinity = "Standard", upgrade = 10, starting_class = "Samurai", target_level = 150, focus = "bleed", vigor = 60, mind = 30, endurance = 30 }
expect = { "result.stats.vigor" = 60, "result.stats.mind" = 30, "result.stats.endurance" = 30, "result.floors.vigor" = 60, "result.floors_are_the_callers_choice" = true }

# A class's own spread is points already spent, so the same build costs a different level from
# a different start — which is why the class has to be asked for rather than assumed.
[[case]]
name = "the starting class changes what the same floors cost"
input = { weapon = "Rivers of Blood", affinity = "Standard", upgrade = 10, starting_class = "Wretch", target_level = 150, focus = "bleed", vigor = 40, mind = 20, endurance = 25 }
expect = { "result.class_level" = 1, "result.level" = 150 }

[[case]]
name = "an unknown focus is refused with the list"
input = { weapon = "Rivers of Blood", affinity = "Standard", upgrade = 10, starting_class = "Samurai", target_level = 150, focus = "damage", vigor = 40, mind = 20, endurance = 25 }
expect_code = 11

[[case]]
name = "an upgrade past the weapon's cap is refused"
input = { weapon = "Rivers of Blood", affinity = "Standard", upgrade = 25, max_upgrade = 10, starting_class = "Samurai", target_level = 150, vigor = 40, mind = 20, endurance = 25 }
expect_code = 11

[[case]]
name = "a rune level beyond 713 is refused"
input = { weapon = "Rivers of Blood", affinity = "Standard", upgrade = 10, starting_class = "Samurai", target_level = 800, vigor = 40, mind = 20, endurance = 25 }
expect_code = 11

[[case]]
name = "a missing floor is a caller error, not a default"
input = { weapon = "Rivers of Blood", affinity = "Standard", upgrade = 10, starting_class = "Samurai", target_level = 150 }
expect_code = 10

# Some weapons carry a flat status that no stat improves. Maximising it is degenerate: the
# search finds nothing to buy and the points fall through to vigor, which looks like an
# optimised build and is not one. The result says so rather than leaving it to be inferred.
[[case]]
name = "a status that does not scale reports no gain from levelling"
input = { weapon = "Star Fist", affinity = "Cold", upgrade = 25, max_upgrade = 25, starting_class = "Hero", target_level = 150, focus = "frost", vigor = 40, mind = 15, endurance = 25 }
expect = { "result.objective_responds_to_stats" = false, "result.objective_gain" = 0.0, "result.objective_value" = 105.0, "result.objective_at_minimum" = 105.0 }

[[case]]
name = "a status that does scale reports what the levelling bought"
input = { weapon = "Rivers of Blood", affinity = "Standard", upgrade = 10, max_upgrade = 10, starting_class = "Hero", target_level = 150, focus = "bleed", vigor = 40, mind = 15, endurance = 25 }
expect = { "result.objective_responds_to_stats" = true, "result.objective_at_minimum" = 52.351250000099 }

# Asking for an affinity a weapon cannot take used to come back with the affinity repeated and
# the Standard figures beneath it. Dragon Halberd is somber: there is no Lightning version of
# it to build for, and the answer has to say so rather than describe one.
[[case]]
name = "an affinity the weapon cannot take is not the one priced"
input = { weapon = "Dragon Halberd", affinity = "Lightning", upgrade = 10, max_upgrade = 10, starting_class = "Vagabond", target_level = 150, focus = "attack", vigor = 40, mind = 20, endurance = 25 }
expect = { "result.affinity" = "Standard", "result.affinity_requested" = "Lightning", "result.affinity_ignored" = true, "result.infusable" = false, "result.total_ar" = 716.6500024893774, "result.stats.strength" = 70, "result.stats.dexterity" = 49 }

# The spread the greedy climb could not reach: every single point moved between dexterity and
# intelligence costs more than it buys, and only the seventh pays off. Pinned against an
# exhaustive sweep of all 2,926 legal spreads run through the oracle directly.
[[case]]
name = "a soft cap a one-point swap cannot cross"
input = { weapon = "Moonveil", affinity = "Standard", upgrade = 10, max_upgrade = 10, starting_class = "Samurai", target_level = 150, focus = "attack", vigor = 40, mind = 20, endurance = 25 }
expect = { "result.stats.dexterity" = 66, "result.stats.intelligence" = 50, "result.total_ar" = 709.8569360643488 }

# A build carries more than the weapon being optimised. The Fingerprint Stone Shield needs 48
# strength, which is a third of the points at RL150, and a spread that ignores it is a spread
# that cannot hold the shield the question was about. Pinned against an exhaustive sweep.
[[case]]
name = "the rest of the loadout's requirements are floors too"
input = { weapon = "Antspur Rapier", affinity = "Keen", upgrade = 25, max_upgrade = 25, starting_class = "Vagabond", target_level = 150, focus = "attack", vigor = 45, mind = 20, endurance = 30, stat_floors = { strength = 48 } }
expect = { "result.stats.strength" = 48, "result.stats.dexterity" = 61, "result.total_ar" = 459.06227427436136, "result.minimum_level" = 109, "result.stat_floors.strength" = 48 }

# --- building for a spell rather than for the weapon holding it.
#
# Questions 1.4, 1.7, 1.8 and 1.12 of the validation battery all asked for a caster's spread,
# and none of them could be answered: the node maximised a catalyst's own attack rating, which
# is a different number scaling off different stats. `focus = "spell"` maximises what the
# spell hits for, with the spell's own requirements as floors so the build can cast it.

[[case]]
name = "a pure faith incantation build maximises the incantation, not the seal"
input = { weapon = "Erdtree Seal", affinity = "Standard", upgrade = 10, max_upgrade = 10, starting_class = "Prophet", target_level = 150, focus = "spell", spell = "Black Flame", vigor = 40, mind = 30, endurance = 20 }
expect = { "result.stats.faith" = 99, "result.spell_attack" = 895.48, "result.spell_buff" = 367.0, "result.spell_damage_types" = ["fire"], "result.spell_castable" = true, "result.objective_responds_to_stats" = true }

# Faith and arcane both move a Dragon Communion Seal, and the split between them is the whole
# question. Pinned against an exhaustive sweep of 102,340 spreads run through planner.py
# directly — the node prices 98 of them and finds the same one.
[[case]]
name = "a hybrid catalyst splits the points, and the split is computed"
input = { weapon = "Dragon Communion Seal", affinity = "Standard", upgrade = 10, max_upgrade = 10, starting_class = "Prophet", target_level = 150, focus = "spell", spell = "Rotten Breath", vigor = 40, mind = 30, endurance = 20 }
expect = { "result.stats.faith" = 43, "result.stats.arcane" = 68, "result.spell_attack" = 544.3912611752413, "result.spell_bonus" = 1.15, "result.spell_bonus_family" = "Dragon Communion" }

# A buff is not a damage spell. Terra Magica has no attack at all, so there is nothing to
# maximise and the points belong in vigor — the same answer shape as a status that does not
# scale, and better than a spread presented as optimised for a figure that never moved.
[[case]]
name = "a spell with no attack cannot be built toward"
input = { weapon = "Carian Regal Scepter", affinity = "Standard", upgrade = 10, max_upgrade = 10, starting_class = "Astrologer", target_level = 150, focus = "spell", spell = "Terra Magica", vigor = 40, mind = 30, endurance = 20 }
expect = { "result.spell_attack" = 0.0, "result.objective_responds_to_stats" = false, "result.stats.intelligence" = 60, "result.spell_castable" = true }

[[case]]
name = "maximising a spell needs a spell"
input = { weapon = "Erdtree Seal", affinity = "Standard", upgrade = 10, max_upgrade = 10, starting_class = "Prophet", target_level = 150, focus = "spell", vigor = 40, mind = 30, endurance = 20 }
expect_code = 11

# Four live stats is more spreads than the sweep will price, so this one goes through the
# coarse-to-fine search. It is here because the greedy climb it replaced stopped at 828.33:
# no single point moved between strength, dexterity, intelligence and faith pays for itself,
# and only a move of several does. Pinned against an exhaustive sweep of 1,837,620 spreads.
#
# The spread itself is the sort of answer nothing but a calculation produces: the Frenzied
# Flame Seal is one of two catalysts in the game whose spell buff takes strength and dexterity
# — the Clawmark Seal is the other — so a "pure faith" build is the wrong build for it.
[[case]]
name = "a catalyst whose spell buff is not pure faith"
input = { weapon = "Frenzied Flame Seal", affinity = "Standard", upgrade = 10, max_upgrade = 10, starting_class = "Prophet", target_level = 150, focus = "spell", spell = "Frenzied Burst", vigor = 40, mind = 30, endurance = 20 }
expect = { "result.stats.strength" = 26, "result.stats.dexterity" = 30, "result.stats.intelligence" = 30, "result.stats.faith" = 43, "result.spell_attack" = 845.4 }
