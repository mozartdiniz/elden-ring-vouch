name = "build-allocate"
version = "0.1.0"

purpose = "Spend a rune level's worth of points on one weapon, maximising attack or a status, above floors the caller sets"

use_when = [
  "the user asks for a stat spread, a distribution, or 'how do I level for this weapon'",
  "the question names a target rune level and a weapon",
  "the user wants to know whether a build fits in a level budget at all",
]
not_for = [
  "what an existing spread hits for — call attack-power, which this node calls internally",
  "picking how much vigor a build should have; that floor is an input, and the answer must say it was chosen rather than computed",
  "ash-of-war or skill damage, which this collection does not model — a spread maximising base attack is not always the best spread for a skill",
  "spell builds; this maximises weapon damage",
]

run = ["python3", "allocate.py"]
timeout_ms = 120000

[[reads]]
path = "../../oracle/extracted/Build-Planner-v1.19.1/csv/WeaponData.csv"

[[reads]]
path = "../../oracle/extracted/Build-Planner-v1.19.1/csv/EquipParamWeapon.csv"

[[reads]]
path = "../../oracle/extracted/Build-Planner-v1.19.1/csv/ReinforceParamWeapon.csv"

[[reads]]
path = "../../oracle/extracted/Build-Planner-v1.19.1/csv/AttackElementCorrectParam.csv"

[[reads]]
path = "../../oracle/extracted/Build-Planner-v1.19.1/csv/CalcCorrectGraphEz.csv"

[[reads]]
path = "../../oracle/extracted/Build-Planner-v1.19.1/csv/StartingClassData.csv"

[[reads]]
path = "../../oracle/extracted/Build-Planner-v1.19.1/csv/StatusEffectData.csv"

[input]
schema = "input.schema.json"

[output]
schema = "output.schema.json"

[params.weapon]
guidance = "The exact catalogue name, from weapon-lookup's `resolved`."

[params.affinity]
guidance = "Standard unless the weapon is infusable and the user named an affinity. To find the best affinity for a build, call optimal-affinity separately — this node takes the affinity as given."

[params.upgrade]
guidance = "Normally weapon-lookup's `max_upgrade`: a spread is usually wanted for the finished weapon."

[params.max_upgrade]
guidance = "Copy weapon-lookup's `max_upgrade`, so an impossible upgrade is refused before the search runs."

[params.starting_class]
guidance = "Used when the user names one — a class's floors are points already spent, so the same spread costs a different level on a different class. Optional: leave it out and the collection uses Wretch, whose flat tens are the lowest floors of the ten, and reports it in `assumed`. Do not ask the user for it. If the user's question already states a value, use that value and do not ask — asking for something they have already told you and then substituting your own is how an answer stops being about their build."

[params.target_level]
guidance = "The rune level the user asked for. If the build does not fit, the result says what it would need rather than failing. This is the caller's judgement and the node will not make it. If the user has not said, offer exactly these and use the first unless they choose another: RL150 — the standard co-op and invasion cap (target_level 150); RL125 — the older duelling cap (target_level 125); RL80 — mid-game co-op (target_level 80). If the user's question already states a value, use that value and do not ask — asking for something they have already told you and then substituting your own is how an answer stops being about their build."

[params.focus]
guidance = "Check `objective_responds_to_stats` in the result: false means nothing the user levels improves this focus, and the honest answer is to say so and suggest a different one rather than reporting the spread as optimised. 'attack' unless the user asked for a status build — 'bleed' for a bleed build, 'frost', 'poison', 'scarlet_rot', 'sleep', 'madness'. It changes the answer: Rivers of Blood at RL150 puts 97 into arcane for bleed and 56 dexterity / 59 arcane for raw attack."

[params.spell]
guidance = "The spell to build for, when the user named one — 'Comet Azur', 'Rotten Breath'. With focus 'spell' it is what gets maximised; with any other focus it is still priced at the spread that was chosen, so a weapon build that also casts can see both. Its own requirements become floors, so the result is a build that can actually cast it."

[params.two_hand]
guidance = "True if the user says they two-hand it. It lowers the strength the weapon needs, which frees points for everything else."

[params.vigor]
guidance = "The minimum vigor to hold back. This is the caller's judgement and the node will not make it. If the user has not said, offer exactly these and use the first unless they choose another: balanced PvE (vigor 40, mind 20, endurance 25); survivability first (vigor 60, mind 20, endurance 20); caster (vigor 40, mind 40, endurance 15); minimum floors, spend the rest on damage (vigor 30, mind 15, endurance 15). If the user's question already states a value, use that value and do not ask — asking for something they have already told you and then substituting your own is how an answer stops being about their build."

[params.mind]
guidance = "The minimum mind. A weapon build with no spells needs little; a caster needs a lot. This is the caller's judgement and the node will not make it. If the user has not said, offer exactly these and use the first unless they choose another: balanced PvE (vigor 40, mind 20, endurance 25); survivability first (vigor 60, mind 20, endurance 20); caster (vigor 40, mind 40, endurance 15); minimum floors, spend the rest on damage (vigor 30, mind 15, endurance 15). If the user's question already states a value, use that value and do not ask — asking for something they have already told you and then substituting your own is how an answer stops being about their build."

[params.endurance]
guidance = "The minimum endurance. It interacts with equip-load: call that node if the user cares about rolling. This is the caller's judgement and the node will not make it. If the user has not said, offer exactly these and use the first unless they choose another: balanced PvE (vigor 40, mind 20, endurance 25); survivability first (vigor 60, mind 20, endurance 20); caster (vigor 40, mind 40, endurance 15); minimum floors, spend the rest on damage (vigor 30, mind 15, endurance 15). If the user's question already states a value, use that value and do not ask — asking for something they have already told you and then substituting your own is how an answer stops being about their build."

# --- preconditions ---

# A spell build needs a spell. Maximising "spell" with nothing named is a question with no
# subject, and the catalyst's own attack rating is not the answer to it.
[[requires]]
expr = "!has(input.focus) || input.focus != \"spell\" || (has(input.spell) && input.spell != \"\")"
message = "focus 'spell' needs the spell to maximise; resolve it with spell-power first"

[[requires]]
expr = '''
input.affinity in [
  "Standard", "Heavy", "Keen", "Quality", "Fire", "Flame Art", "Lightning",
  "Sacred", "Magic", "Cold", "Poison", "Blood", "Occult"
]
'''
message = "unknown affinity; the thirteen are Standard, Heavy, Keen, Quality, Fire, Flame Art, Lightning, Sacred, Magic, Cold, Poison, Blood and Occult"

[[requires]]
expr = '''
!has(input.focus) || input.focus in [
  "attack", "spell", "bleed", "frost", "poison", "scarlet_rot", "sleep", "madness"
]
'''
message = "focus must be 'attack', 'spell', or one of the six statuses: bleed, frost, poison, scarlet_rot, sleep, madness"

[[requires]]
expr = '''
!has(input.starting_class) || input.starting_class in [
  "Vagabond", "Warrior", "Hero", "Bandit", "Astrologer",
  "Prophet", "Samurai", "Prisoner", "Confessor", "Wretch"
]
'''
message = "unknown starting class; the ten are Vagabond, Warrior, Hero, Bandit, Astrologer, Prophet, Samurai, Prisoner, Confessor and Wretch"

[[requires]]
expr = "input.upgrade >= 0 && input.upgrade <= 25"
message = "upgrade must be between 0 and 25; call weapon-lookup for this weapon's actual cap"

[[requires]]
expr = "!has(input.max_upgrade) || input.upgrade <= input.max_upgrade"
message = "this weapon cannot be upgraded that far; weapon-lookup reported a lower max_upgrade for it"

[[requires]]
expr = "input.target_level >= 1 && input.target_level <= 713"
message = "rune level runs from 1 to 713; 713 is the highest a character can reach with every stat at 99"

[[requires]]
expr = """
input.vigor >= 1 && input.vigor <= 99 &&
input.mind >= 1 && input.mind <= 99 &&
input.endurance >= 1 && input.endurance <= 99
"""
message = "each floor must be between 1 and 99; these are the minimums to hold back before the rest is spent"

# --- postconditions ---

# The affinity the figures were computed with is the applied one, and a weapon that takes no
# affinity was priced as Standard. Without this a caller can repeat "Lightning Dragon Halberd"
# back at a user over figures for the Standard weapon.
[[ensures]]
expr = "result.affinity_ignored == (result.affinity != result.affinity_requested)"

# A staff casts sorceries and a seal casts incantations. Without this the node will happily
# build a spread around a cast the game does not allow — a Carian Regal Scepter maximising
# Black Flame came back at 926.38 with 88 intelligence behind it.
[[ensures]]
expr = "result.spell_castable_from_catalyst"

# Every floor the rest of the loadout needs is met. A spread that cannot hold the shield it
# was built around is not an answer to the question that was asked.
[[ensures]]
expr = """
result.stats.strength >= result.stat_floors.strength &&
result.stats.dexterity >= result.stat_floors.dexterity &&
result.stats.intelligence >= result.stat_floors.intelligence &&
result.stats.faith >= result.stat_floors.faith &&
result.stats.arcane >= result.stat_floors.arcane
"""

[[ensures]]
expr = "result.infusable || result.affinity == \"Standard\""


[[ensures]]
expr = "result.upgrade <= result.max_upgrade"

[[ensures]]
expr = "!has(input.max_upgrade) || input.max_upgrade == result.max_upgrade"

# A feasible build costs exactly what was asked for — not less, which would leave points
# unspent, and not more, which would be a different character.
[[ensures]]
expr = """
result.feasible
  ? (result.level == result.target_level && result.minimum_level <= result.target_level)
  : (result.level == result.minimum_level && result.minimum_level > result.target_level)
"""

[[ensures]]
expr = "result.target_level == input.target_level && result.level == result.class_level + result.points_spent"

# No stat below the class's own floor: that is what a starting class is.
[[ensures]]
expr = """
result.stats.vigor >= result.class_minimums.vigor &&
result.stats.mind >= result.class_minimums.mind &&
result.stats.endurance >= result.class_minimums.endurance &&
result.stats.strength >= result.class_minimums.strength &&
result.stats.dexterity >= result.class_minimums.dexterity &&
result.stats.intelligence >= result.class_minimums.intelligence &&
result.stats.faith >= result.class_minimums.faith &&
result.stats.arcane >= result.class_minimums.arcane
"""

# The caller's floors are honoured, or the stat is already at 99 and cannot go higher. A node
# that quietly spent below a floor would be substituting its judgement for the caller's.
[[ensures]]
expr = """
(result.stats.vigor >= result.floors.vigor || result.stats.vigor == 99) &&
(result.stats.mind >= result.floors.mind || result.stats.mind == 99) &&
(result.stats.endurance >= result.floors.endurance || result.stats.endurance == 99)
"""

[[ensures]]
expr = """
result.floors.vigor == input.vigor && result.floors.mind == input.mind &&
result.floors.endurance == input.endurance && result.floors_are_the_callers_choice
"""

# The figure that was maximised is the figure it claims to be.
[[ensures]]
expr = """
result.focus == "attack"
  ? result.objective_value == result.total_ar
  : (result.focus == "spell" ? result.objective_value == result.spell_attack
    : (result.focus == "bleed" ? result.objective_value == result.status.bleed
    : (result.focus == "frost" ? result.objective_value == result.status.frost
    : (result.focus == "poison" ? result.objective_value == result.status.poison
    : (result.focus == "scarlet_rot" ? result.objective_value == result.status.scarlet_rot
    : (result.focus == "sleep" ? result.objective_value == result.status.sleep
    : result.objective_value == result.status.madness))))))
"""

# What the levelling bought is the difference it claims to be, and "this focus responds to
# stats" is exactly a positive gain. A weapon whose status is flat — Star Fist's frost, Great
# Stars' bleed — cannot be built toward, and saying so is more useful than a spread.
[[ensures]]
expr = """
result.objective_gain - (result.objective_value - result.objective_at_minimum) < 0.000001 &&
(result.objective_value - result.objective_at_minimum) - result.objective_gain < 0.000001 &&
result.objective_responds_to_stats == (result.objective_gain > 0.0)
"""

# The same identities `attack-power` holds to, because these are its figures: the total is the
# sum of its parts, and what the game shows is that truncated.
[[ensures]]
expr = """
result.attack.physical + result.attack.magic + result.attack.fire +
result.attack.lightning + result.attack.holy - result.total_ar < 0.000001 &&
result.total_ar - (result.attack.physical + result.attack.magic + result.attack.fire +
result.attack.lightning + result.attack.holy) < 0.000001
"""

[[ensures]]
expr = "result.total_ar_rounded <= result.total_ar && result.total_ar < result.total_ar_rounded + 1"

[[ensures]]
expr = """
result.attack_shown.physical <= result.attack.physical && result.attack.physical < result.attack_shown.physical + 1 &&
result.status_shown.bleed <= result.status.bleed && result.status.bleed < result.status_shown.bleed + 1 &&
result.status_shown.frost <= result.status.frost && result.status.frost < result.status_shown.frost + 1
"""

# A feasible build meets the weapon's requirements — that is part of what the floor cost buys.
[[ensures]]
expr = "!result.feasible || result.requirements_met"

[[examples]]
ask = "Quero fazer uma build de Rivers of Blood no nível 150, classe Samurai. Monta a distribuição."
call = { weapon = "Rivers of Blood", affinity = "Standard", upgrade = 10, max_upgrade = 10, starting_class = "Samurai", target_level = 150, focus = "bleed", vigor = 40, mind = 20, endurance = 25 }

[[examples]]
ask = "Build de Bloodhound's Fang no nível 125 pra PvP. Como distribuo os status?"
call = { weapon = "Bloodhound's Fang", affinity = "Standard", upgrade = 10, max_upgrade = 10, starting_class = "Vagabond", target_level = 125, focus = "attack", vigor = 40, mind = 12, endurance = 20 }

# A default that is not reported is bug 17 again. The contract is not about the value — it is
# about the saying.
[[ensures]]
expr = 'has(input.starting_class) ? !("starting_class" in result.assumed) : result.assumed.starting_class == result.starting_class'
message = "a judgement the collection made for the caller has to appear in `assumed`"

[[ensures]]
expr = 'has(input.two_hand) ? !("two_hand" in result.assumed) : result.assumed.two_hand == result.two_hand'
message = "whether the weapon is two-handed moves the answer, so an unstated one has to be reported"
