# Node fixtures (§7.1). The class starting levels and HP are the game's own; the rest pins
# the behaviour that stops a caller inventing a stat.

[[case]]
name = "Wretch starts at rune level 1 with flat tens"
input = { starting_class = "Wretch" }
expect = { "result.level" = 1, "result.class_level" = 1, "result.points_spent" = 0, "result.stats.vigor" = 10, "result.stats.arcane" = 10 }

[[case]]
name = "Hero starts at rune level 7"
input = { starting_class = "Hero" }
expect = { "result.class_level" = 7, "result.stats.strength" = 16, "result.hp" = 499 }

[[case]]
name = "Astrologer starts at rune level 6"
input = { starting_class = "Astrologer" }
expect = { "result.class_level" = 6, "result.stats.intelligence" = 16 }

# The case this node exists for: two stats named, six filled from the class, and the result
# says which were which so an answer can be honest about what nobody chose.
[[case]]
name = "unnamed stats come from the class, and are reported as such"
input = { starting_class = "Hero", strength = 60, faith = 60 }
expect = { "result.level" = 103, "result.points_spent" = 96, "result.stats.dexterity" = 9, "result.stats_given[0]" = "faith", "result.stats_given[1]" = "strength", "result.stats_from_class_minimum[0]" = "arcane" }

[[case]]
name = "a named stat comes back exactly as given"
input = { starting_class = "Astrologer", intelligence = 60, vigor = 40 }
expect = { "result.stats.intelligence" = 60, "result.stats.vigor" = 40 }

# A class cannot go below its own floor, so asking for less gives the floor back.
[[case]]
name = "asking below the class floor returns the floor, and says so"
input = { starting_class = "Hero", strength = 5 }
expect = { "result.stats.strength" = 16, "result.stats_raised_to_class_minimum[0]" = "strength" }

[[case]]
name = "the optimal class for a pure intelligence build is the one that starts there"
input = { starting_class = "Hero", intelligence = 60 }
expect = { "result.optimal_class" = "Astrologer" }

[[case]]
name = "an unknown starting class is refused by the enum, before the precondition"
input = { starting_class = "Paladin" }
expect_code = 10

[[case]]
name = "a stat above 99 is refused"
input = { starting_class = "Hero", strength = 120 }
expect_code = 11

# Was "a missing starting class is a caller error", which stopped being true when the
# collection took responsibility for the choice. The question it was really asking — does a
# bare call still produce a defensible answer — is now the determinism case below.
[[case]]
name = "a target level makes the levels left a returned figure"
input = { starting_class = "Hero", strength = 60, faith = 60, target_level = 150 }
expect = { "result.level" = 103, "result.target_level" = 150, "result.levels_to_target" = 47 }

[[case]]
name = "no target level means zero, not a misleading count"
input = { starting_class = "Hero", strength = 60, faith = 60 }
expect = { "result.target_level" = 0, "result.levels_to_target" = 0 }

# A build that already costs more than the target is over budget, and says so with a sign
# rather than by refusing: the user still needs to know by how much.
[[case]]
name = "a build over its target reports a negative remainder"
input = { starting_class = "Hero", strength = 99, faith = 99, vigor = 60, target_level = 100 }
expect = { "result.levels_to_target" = -127 }

# The spreadsheet's own "[Default] PvE - Strength RL150", which is the one of its three saved
# builds wearing no talisman that touches HP, stamina or equip load — so its vitals are
# directly comparable. The sheet: level 157, HP 1900, FP 88, stamina 125, equip load 74.1.
[[case]]
name = "the spreadsheet's strength build, vitals and level"
input = { starting_class = "Confessor", vigor = 60, mind = 13, endurance = 27, strength = 79, dexterity = 12, intelligence = 9, faith = 27, arcane = 9 }
expect = { "result.level" = 157, "result.hp" = 1900, "result.fp" = 88, "result.stamina" = 125, "result.equip_load" = 74.06015257 }

# The determinism cases. Same question twice, once with the class and once without: the
# collection's own choice has to be stable and has to be declared.
[[case]]
name = "no class given falls to the least-distorting one, and says so"
input = { vigor = 40, mind = 20, endurance = 25 }
expect = { "result.starting_class" = "Wretch", "result.assumed.starting_class" = "Wretch" }

[[case]]
name = "a class the caller gave is never reported as an assumption"
input = { starting_class = "Samurai", vigor = 40 }
expect = { "result.starting_class" = "Samurai", "result.assumed" = {} }

# ---------------------------------------------------------------- from the game itself
#
# The same three characters' status panels. Rune level, HP, FP and stamina, read off the
# screen rather than derived from anything. All three sum to 229 stat points at level 150,
# which is the `sum - 79` rule this collection has always used, confirmed by the game.

[[case]]
name = "the game: RL150 dexterity build — level, HP, FP, stamina"
input = { starting_class = "Prisoner", vigor = 51, mind = 25, endurance = 26, strength = 20, dexterity = 57, intelligence = 14, faith = 27, arcane = 9 }
expect = { "result.level" = 150, "result.hp" = 1727, "result.fp" = 147, "result.stamina" = 123 }

[[case]]
name = "the game: RL150 strength-faith build"
input = { starting_class = "Prisoner", vigor = 53, mind = 25, endurance = 20, strength = 53, dexterity = 15, intelligence = 14, faith = 40, arcane = 9 }
expect = { "result.level" = 150, "result.hp" = 1772, "result.fp" = 147, "result.stamina" = 113 }

# The screen shows 128 FP against this node's 121, and the node is right: the character wears
# St. Trina's Blossom, which is x1.07 FP — 121 x 1.06 = 128.26. `item-effect` pins
# `applied_to_a_build: false` and this is what that limitation looks like from the outside.
[[case]]
name = "the game: RL150 arcane build, whose FP on screen includes a headpiece this does not apply"
input = { starting_class = "Prisoner", vigor = 55, mind = 20, endurance = 25, strength = 30, dexterity = 14, intelligence = 14, faith = 6, arcane = 65 }
expect = { "result.level" = 150, "result.hp" = 1814, "result.stamina" = 121, "result.fp" = 121 }

# The fourth character, and the cleanest FP reading of the four: mind 35 with nothing worn
# that changes it.
[[case]]
name = "the game: RL150 intelligence build — mind 35 is 200 FP"
input = { starting_class = "Prisoner", vigor = 53, mind = 35, endurance = 20, strength = 12, dexterity = 14, intelligence = 80, faith = 6, arcane = 9 }
expect = { "result.level" = 150, "result.hp" = 1772, "result.fp" = 200, "result.stamina" = 113 }
