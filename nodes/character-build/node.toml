name = "character-build"
version = "0.1.0"

purpose = "Turn a starting class and the stats a user named into a complete build: full spread, rune level, HP, FP, stamina and equip load"

use_when = [
  "the user describes a build by some of its stats — 'strength and faith', '60 vigor' — and the rest are unstated",
  "the question mentions a rune level, or asks what level a spread costs",
  "you need a stat spread to pass to attack-power and the user did not give all five",
  "the question asks which starting class suits a build",
]
not_for = [
  "attack rating or weapon scaling — pass this node's `stats` to attack-power",
  "armour, talismans and poise; this reports the bare character",
  "deciding how to spend levels for the user, which is a judgement and not a calculation",
]

run = ["python3", "build.py"]
timeout_ms = 30000

[[reads]]
path = "../../oracle/extracted/Build-Planner-v1.19.1/csv/StartingClassData.csv"

[[reads]]
path = "../../oracle/extracted/Build-Planner-v1.19.1/csv/PlayerCommonParam.csv"

[input]
schema = "input.schema.json"

[output]
schema = "output.schema.json"

[params.starting_class]
guidance = "Used when the user names one — a class's floors are points already spent, so the same spread costs a different level on a different class. Optional: leave it out and the collection uses Wretch, whose flat tens are the lowest floors of the ten, and reports it in `assumed`. Do not ask the user for it. If the user's question already states a value, use that value and do not ask — asking for something they have already told you and then substituting your own is how an answer stops being about their build."

[params.target_level]
guidance = "The rune level the user named, e.g. 150 for 'an RL150 build'. Pass it: the levels left over then come back as a number instead of a subtraction you would have to do yourself. If the user's question already states a value, use that value and do not ask — asking for something they have already told you and then substituting your own is how an answer stops being about their build."

[params.vigor]
guidance = "Omit any stat the user did not name. It comes back as the class minimum, and the result says which stats that happened to, so an answer can be honest about what was assumed. Never invent a value to fill the gap. If the user's question already states a value, use that value and do not ask — asking for something they have already told you and then substituting your own is how an answer stops being about their build."

[params.mind]
guidance = "Omit unless the user named it. If the user's question already states a value, use that value and do not ask — asking for something they have already told you and then substituting your own is how an answer stops being about their build."

[params.endurance]
guidance = "Omit unless the user named it. If the user's question already states a value, use that value and do not ask — asking for something they have already told you and then substituting your own is how an answer stops being about their build."

[params.strength]
guidance = "Omit unless the user named it."

[params.dexterity]
guidance = "Omit unless the user named it."

[params.intelligence]
guidance = "Omit unless the user named it."

[params.faith]
guidance = "Omit unless the user named it."

[params.arcane]
guidance = "Omit unless the user named it."

# The schema's enum now does this, and does it earlier and with a better message. Kept, and
# guarded against absence, because a contract that fails closed on a legal input refuses it:
# an unevaluable contract is a refusal (exit 15), so the moment the class became optional this
# expression started rejecting every call that left it out.
[[requires]]
expr = '''
!has(input.starting_class) || input.starting_class in [
  "Vagabond", "Warrior", "Hero", "Bandit", "Astrologer",
  "Prophet", "Samurai", "Prisoner", "Confessor", "Wretch"
]
'''
message = "unknown starting class; the ten are Vagabond, Warrior, Hero, Bandit, Astrologer, Prophet, Samurai, Prisoner, Confessor and Wretch"

[[requires]]
expr = """
(!has(input.vigor) || (input.vigor >= 1 && input.vigor <= 99)) &&
(!has(input.mind) || (input.mind >= 1 && input.mind <= 99)) &&
(!has(input.endurance) || (input.endurance >= 1 && input.endurance <= 99)) &&
(!has(input.strength) || (input.strength >= 1 && input.strength <= 99)) &&
(!has(input.dexterity) || (input.dexterity >= 1 && input.dexterity <= 99)) &&
(!has(input.intelligence) || (input.intelligence >= 1 && input.intelligence <= 99)) &&
(!has(input.faith) || (input.faith >= 1 && input.faith <= 99)) &&
(!has(input.arcane) || (input.arcane >= 1 && input.arcane <= 99))
"""
message = "every stat given must be between 1 and 99; omit a stat entirely rather than passing 0 for one the user did not name"

# No stat may come back below the class's own floor — that is what a starting class is.
[[ensures]]
expr = """
result.stats.vigor >= result.class_minimums.vigor &&
result.stats.mind >= result.class_minimums.mind &&
result.stats.endurance >= result.class_minimums.endurance &&
result.stats.strength >= result.class_minimums.strength &&
result.stats.dexterity >= result.class_minimums.dexterity &&
result.stats.intelligence >= result.class_minimums.intelligence &&
result.stats.faith >= result.class_minimums.faith &&
result.stats.arcane >= result.class_minimums.arcane
"""

# A stat the caller named comes back exactly as given — unless it was below the class floor,
# in which case it comes back at the floor *and* is named in stats_raised_to_class_minimum.
# This node fills gaps and reports substitutions; it never quietly moves a chosen number.
[[ensures]]
expr = """
(!has(input.strength) || result.stats.strength == input.strength || "strength" in result.stats_raised_to_class_minimum) &&
(!has(input.faith) || result.stats.faith == input.faith || "faith" in result.stats_raised_to_class_minimum) &&
(!has(input.dexterity) || result.stats.dexterity == input.dexterity || "dexterity" in result.stats_raised_to_class_minimum) &&
(!has(input.intelligence) || result.stats.intelligence == input.intelligence || "intelligence" in result.stats_raised_to_class_minimum) &&
(!has(input.arcane) || result.stats.arcane == input.arcane || "arcane" in result.stats_raised_to_class_minimum) &&
(!has(input.vigor) || result.stats.vigor == input.vigor || "vigor" in result.stats_raised_to_class_minimum) &&
(!has(input.mind) || result.stats.mind == input.mind || "mind" in result.stats_raised_to_class_minimum) &&
(!has(input.endurance) || result.stats.endurance == input.endurance || "endurance" in result.stats_raised_to_class_minimum)
"""

# A raised stat has to be one the caller actually named, and has to have landed on the floor.
# Without this the escape hatch above would excuse any substitution the node cared to make.
[[ensures]]
expr = """
result.stats_raised_to_class_minimum.all(s,
  s in result.stats_given &&
  (s != "strength" || result.stats.strength == result.class_minimums.strength) &&
  (s != "faith" || result.stats.faith == result.class_minimums.faith) &&
  (s != "dexterity" || result.stats.dexterity == result.class_minimums.dexterity) &&
  (s != "intelligence" || result.stats.intelligence == result.class_minimums.intelligence) &&
  (s != "arcane" || result.stats.arcane == result.class_minimums.arcane) &&
  (s != "vigor" || result.stats.vigor == result.class_minimums.vigor) &&
  (s != "mind" || result.stats.mind == result.class_minimums.mind) &&
  (s != "endurance" || result.stats.endurance == result.class_minimums.endurance)
)
"""

# Rune level is the class's own starting level plus every point spent on top of it. This is
# the arithmetic a reader would otherwise have to redo to check the answer, so the node has to
# be internally consistent about it.
[[ensures]]
expr = "result.level == result.class_level + result.points_spent"

# Every stat is either one the caller gave or one filled from the class — never both, never
# neither. This is what lets an answer say which figures nobody chose.
[[ensures]]
expr = "size(result.stats_given) + size(result.stats_from_class_minimum) == 8"

# Whatever is left to spend has to be the difference this node computed, not one a reader
# redoes — and with no target given, both are zero rather than a misleading count.
[[ensures]]
expr = """
has(input.target_level)
  ? (result.target_level == input.target_level &&
     result.levels_to_target == result.target_level - result.level)
  : (result.target_level == 0 && result.levels_to_target == 0)
"""

[[ensures]]
expr = "result.optimal_class_level <= result.level"

[[ensures]]
expr = "result.levels_saved_by_optimal_class == result.level - result.optimal_class_level"

[[ensures]]
expr = "result.hp > 0 && result.fp > 0 && result.stamina > 0 && result.equip_load > 0.0"

[[examples]]
ask = "I want a strength and faith build at 60/60. What level is that?"
call = { starting_class = "Hero", strength = 60, faith = 60 }

[[examples]]
ask = "how many levels do I have left on an RL150 strength-faith build at 60/60?"
call = { starting_class = "Hero", strength = 60, faith = 60, target_level = 150 }

[[examples]]
ask = "what does an RL150 Astrologer with 60 intelligence and 40 vigor look like?"
call = { starting_class = "Astrologer", intelligence = 60, vigor = 40 }

# A default that is not reported is bug 17 again: the same class, applied silently, while the
# parameter's own guidance said to leave it out. Reported, it is an assumption a reader can
# reject. So the contract is not about the value — it is about the saying.
[[ensures]]
expr = 'has(input.starting_class) ? size(result.assumed) == 0 : result.assumed.starting_class == result.starting_class'
message = "a judgement the collection made for the caller has to appear in `assumed`"
