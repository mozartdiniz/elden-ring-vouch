# Node fixtures (§7.1).
#
# The first three are pinned against figures the **Prometheux Elden Ring Brain** ontology
# produced independently, recorded in its HANDOFF.md: `character_defense` for a bare Vagabond,
# `resist_base`, and the geared Knight-set resists. Agreement there is the differential check
# this collection exists to have.

[[case]]
name = "a bare Vagabond's defences (Prometheux: 79/93/85/75/89)"
input = { starting_class = "Vagabond" }
expect = { "result.defence.physical" = 79, "result.defence.magic" = 93, "result.defence.fire" = 85, "result.defence.lightning" = 75, "result.defence.holy" = 89 }

[[case]]
name = "base resistances with nothing worn (Prometheux: 92/92/92/99)"
input = { starting_class = "Vagabond" }
expect = { "result.resist.immunity" = 92, "result.resist.robustness" = 92, "result.resist.focus" = 92, "result.resist.vitality" = 99 }

[[case]]
name = "the Knight set's resistances (Prometheux: 200/224/147/154)"
input = { starting_class = "Vagabond", vigor = 40, endurance = 20, strength = 40, head = "Knight Helm", chest = "Knight Armor", arms = "Knight Gauntlets", legs = "Knight Greaves" }
expect = { "result.resist.immunity" = 200, "result.resist.robustness" = 224, "result.resist.focus" = 147, "result.resist.vitality" = 154, "result.armour_weight" = 25.3 }

# Physical negation splits three ways, and a set is rarely equally good against all three.
# Collapsing them to one number would throw away the part worth knowing.
[[case]]
name = "physical negation splits into strike, slash and pierce"
input = { starting_class = "Vagabond", vigor = 40, endurance = 20, strength = 40, head = "Knight Helm", chest = "Knight Armor", arms = "Knight Gauntlets", legs = "Knight Greaves" }
expect = { "result.negation_percent.physical" = 24.612, "result.negation_percent.strike" = 23.621, "result.negation_percent.slash" = 26.501, "result.negation_percent.pierce" = 26.501 }

# Wearing nothing removes nothing. This is what a caller gets when an armour name failed to
# resolve, so it has to be unmistakable rather than a small number.
[[case]]
name = "wearing nothing negates nothing"
input = { starting_class = "Vagabond" }
expect = { "result.negation.physical" = 0.0, "result.absorb.physical" = 1.0, "result.armour_weight" = 0.0 }

[[case]]
name = "unnamed stats come from the class and are reported as such"
input = { starting_class = "Hero", vigor = 60 }
expect = { "result.stats.vigor" = 60, "result.stats.strength" = 16, "result.stats_given[0]" = "vigor", "result.stats_from_class_minimum[0]" = "arcane" }

# The same substitution character-build reports: a stat asked below the class floor comes back
# raised, and says so rather than being absorbed.
[[case]]
name = "a stat below the class floor is raised, and says so"
input = { starting_class = "Hero", strength = 5 }
expect = { "result.stats.strength" = 16, "result.stats_raised_to_class_minimum[0]" = "strength" }

[[case]]
name = "talismans are never modelled"
input = { starting_class = "Vagabond" }
expect = { "result.talismans_modelled" = false }

[[case]]
name = "an unknown starting class is refused by the enum, before the precondition"
input = { starting_class = "Paladin" }
expect_code = 10

[[case]]
name = "a stat above 99 is refused"
input = { starting_class = "Vagabond", vigor = 150 }
expect_code = 11

# Was "a missing starting class is a caller error". It stopped being one when the collection
# took responsibility for the choice; the determinism cases below are what it became.
[[case]]
name = "the sheet's faith build: defence, negation and resistance"
input = { starting_class = "Confessor", vigor = 60, mind = 13, endurance = 25, strength = 15, dexterity = 24, intelligence = 9, faith = 79, arcane = 9, head = "Crucible Axe Helm", chest = "Tree Sentinel Armor", arms = "Briar Gauntlets", legs = "Tree Sentinel Greaves" }
expect = { "result.defence.physical" = 138, "result.defence.magic" = 151, "result.defence.fire" = 193, "result.defence.lightning" = 133, "result.defence.holy" = 151, "result.resist.immunity" = 340, "result.resist.robustness" = 359, "result.resist.focus" = 249, "result.resist.vitality" = 265 }

[[case]]
name = "the sheet's intelligence build: the same armour, different stats"
input = { starting_class = "Confessor", vigor = 60, mind = 25, endurance = 24, strength = 12, dexterity = 13, intelligence = 80, faith = 14, arcane = 9, head = "Crucible Axe Helm", chest = "Tree Sentinel Armor", arms = "Briar Gauntlets", legs = "Tree Sentinel Greaves" }
expect = { "result.defence.magic" = 199, "result.defence.fire" = 194, "result.defence.lightning" = 134, "result.defence.holy" = 152, "result.resist.immunity" = 341, "result.resist.robustness" = 360, "result.resist.focus" = 250, "result.resist.vitality" = 266 }

# Negation comes from the armour alone, so it is identical on both builds — 34.224% physical,
# 28.261 strike, 34.151 slash, 32.516 pierce, and the sheet says the same to three decimals.
[[case]]
name = "and the eight negation percentages the armour gives"
input = { starting_class = "Confessor", vigor = 60, mind = 13, endurance = 25, strength = 15, dexterity = 24, intelligence = 9, faith = 79, arcane = 9, head = "Crucible Axe Helm", chest = "Tree Sentinel Armor", arms = "Briar Gauntlets", legs = "Tree Sentinel Greaves" }
expect = { "result.negation_percent.physical" = 34.224, "result.negation_percent.strike" = 28.261, "result.negation_percent.slash" = 34.151, "result.negation_percent.pierce" = 32.516, "result.negation_percent.magic" = 25.219, "result.negation_percent.fire" = 30.952, "result.negation_percent.lightning" = 23.772, "result.negation_percent.holy" = 26.876 }

# Determinism. The same question twice — once without a class, once with — because the drift
# the battery measured was a model choosing this parameter differently between runs.
[[case]]
name = "no class given falls to the least-distorting one, and says so"
input = { vigor = 40, mind = 20, endurance = 25 }
expect = { "result.starting_class" = "Wretch", "result.assumed.starting_class" = "Wretch" }

[[case]]
name = "a class the caller gave is never reported as an assumption"
input = { vigor = 40, mind = 20, endurance = 25, starting_class = "Vagabond" }
expect = { "result.starting_class" = "Vagabond", "result.assumed" = {} }
