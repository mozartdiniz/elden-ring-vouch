# Node fixtures (§7.1).
#
# The five `spell_ar` cases below are pinned against the **Prometheux Elden Ring Brain**
# ontology, the independent implementation this collection is a second version of. Its figures
# are recorded in `prometheux-workspace/HANDOFF.md`, and they are the only check available on
# the one piece of arithmetic here that the Python oracle does not do: the scripts stop at the
# spell buff, and `attack = base_attack x spell_buff / 100 x bonus`, summed over every damage
# type the spell deals, is ours.
#
# All five agree to six significant figures. Getting there took a real bug out of this
# collection: the Academy and Carian Glintstone staves reach +25 without taking any affinity,
# and `max_upgrade` had capped them at +10.

[[case]]
name = "Comet from a Carian Regal Scepter (Prometheux: 1090.912)"
input = { spell = "Comet", catalyst = "Carian Regal Scepter", upgrade = 10, strength = 10, dexterity = 10, intelligence = 80, faith = 10, arcane = 10 }
expect = { "result.attack" = 1090.912, "result.spell_buff" = 373.6, "result.base_attack.magic" = 292.0, "result.bonus" = 1.0 }

[[case]]
name = "Comet from Lusat's Glintstone Staff (Prometheux: 1207.42)"
input = { spell = "Comet", catalyst = "Lusat's Glintstone Staff", upgrade = 10, strength = 10, dexterity = 10, intelligence = 80, faith = 10, arcane = 10 }
expect = { "result.attack" = 1207.42 }

# Lusat's boosts every school, and that boost is already inside its spell buff. Its
# castingBonusRate reads "1.5x FP cost", not a number, so no multiplier is applied on top.
[[case]]
name = "a bonus already inside the spell buff is not applied twice"
input = { spell = "Comet", catalyst = "Lusat's Glintstone Staff", upgrade = 10, strength = 10, dexterity = 10, intelligence = 80, faith = 10, arcane = 10 }
expect = { "result.bonus" = 1.0, "result.bonus_applied" = false }

# The staff that exposed the upgrade-cap bug: it takes no affinity and still reaches +25.
[[case]]
name = "Comet from an Academy Glintstone Staff at +25 (Prometheux: 1009.444)"
input = { spell = "Comet", catalyst = "Academy Glintstone Staff", upgrade = 25, max_upgrade = 25, strength = 10, dexterity = 10, intelligence = 80, faith = 10, arcane = 10 }
expect = { "result.attack" = 1009.444, "result.spell_buff" = 345.7 }

[[case]]
name = "Adula's Moonblade on a Carian Glintstone Staff, Carian Sword bonus (Prometheux: 503.97)"
input = { spell = "Adula's Moonblade", catalyst = "Carian Glintstone Staff", upgrade = 25, max_upgrade = 25, strength = 10, dexterity = 10, intelligence = 80, faith = 10, arcane = 10 }
expect = { "result.attack" = 503.97, "result.bonus" = 1.15, "result.bonus_applied" = true, "result.bonus_family" = "Carian Sword" }

[[case]]
name = "Ranni's Dark Moon on a Regal Scepter, Full Moon bonus (Prometheux: 1356.168)"
input = { spell = "Ranni's Dark Moon", catalyst = "Carian Regal Scepter", upgrade = 10, strength = 10, dexterity = 10, intelligence = 80, faith = 10, arcane = 10 }
expect = { "result.attack" = 1356.168, "result.bonus" = 1.1, "result.bonus_family" = "Full Moon" }

# --- what the ontology has no opinion about -----------------------------------------

# "Comet" is three rows in MagicData: the plain cast at 292, and two charged variants at 365.
# Keying on Name kept whichever came last, so this node once reported a charged Comet as an
# ordinary one. Display Name is the unique key, and the other forms are named in the result.
[[case]]
name = "a charged variant is a different spell, and both are reachable"
input = { spell = "Comet - Charged", catalyst = "Carian Regal Scepter", upgrade = 10, strength = 10, dexterity = 10, intelligence = 80, faith = 10, arcane = 10 }
expect = { "result.base_attack.magic" = 365.0, "result.forms[0]" = "Comet", "result.forms[1]" = "Comet - Charged" }

[[case]]
name = "a spell the build cannot cast says what is short"
input = { spell = "Ranni's Dark Moon", catalyst = "Carian Regal Scepter", upgrade = 10, strength = 10, dexterity = 10, intelligence = 20, faith = 10, arcane = 10 }
expect = { "result.castable" = false, "result.unmet[0]" = "intelligence", "result.requirement.intelligence" = 68 }

[[case]]
name = "casting from something that is not a catalyst is refused"
input = { spell = "Comet", catalyst = "Longsword", catalyst_class = "Straight Sword", upgrade = 25, strength = 10, dexterity = 10, intelligence = 80, faith = 10, arcane = 10 }
expect_code = 11

[[case]]
name = "an upgrade past the catalyst's cap is refused"
input = { spell = "Comet", catalyst = "Carian Regal Scepter", upgrade = 25, max_upgrade = 10, strength = 10, dexterity = 10, intelligence = 80, faith = 10, arcane = 10 }
expect_code = 11

# --- incantations, and the reason they are here.
#
# Every one of these returned zero before September 2026: the node read `MagicAtk` and nothing
# else, so a spell whose damage is in the fire, lightning, holy or physical column priced at
# nothing. It surfaced as a schema defect rather than a wrong number, which is the only reason
# it was not quoted at somebody — but it meant no incantation in the game could be answered.
#
# The differential check could not have found it: the Prometheux ontology computes
# `MagicAtk x SB / 100 x Mult` too, so both implementations were wrong in the same place. It
# took a real question — "pure Faith incantation build with the Erdtree Seal" — to surface it.

[[case]]
name = "an incantation's damage is not in the magic column"
input = { spell = "Black Flame", catalyst = "Erdtree Seal", upgrade = 10, strength = 11, dexterity = 10, intelligence = 7, faith = 60, arcane = 10 }
expect = { "result.attack" = 667.462, "result.attack_by_type.fire" = 667.462, "result.base_attack.fire" = 244.0, "result.base_attack.magic" = 0.0, "result.spell_buff" = 273.55, "result.spell_type" = "Incantation" }

[[case]]
name = "a seal's family bonus applies to an incantation"
input = { spell = "Black Flame", catalyst = "Godslayer's Seal", upgrade = 10, strength = 11, dexterity = 10, intelligence = 7, faith = 60, arcane = 10 }
expect = { "result.attack" = 576.389, "result.bonus" = 1.1, "result.bonus_applied" = true, "result.bonus_family" = "Godslayer" }

[[case]]
name = "lightning is its own column too"
input = { spell = "Lightning Spear", catalyst = "Erdtree Seal", upgrade = 10, strength = 11, dexterity = 10, intelligence = 7, faith = 60, arcane = 10 }
expect = { "result.attack" = 640.107, "result.attack_by_type.lightning" = 640.107, "result.damage_types" = ["lightning"] }

# A spell can deal two types, and the total is both of them. Reading one column called this
# 373.6 when it is 1046.08 — the same bug, in a sorcery, where it is easy to miss because the
# figure that comes back looks plausible.
[[case]]
name = "a spell that deals two damage types is both of them"
input = { spell = "Meteorite", catalyst = "Carian Regal Scepter", upgrade = 10, strength = 10, dexterity = 10, intelligence = 80, faith = 10, arcane = 10 }
expect = { "result.attack" = 1046.08, "result.attack_by_type.physical" = 672.48, "result.attack_by_type.magic" = 373.6, "result.damage_types" = ["magic", "physical"] }

# A staff casts sorceries and a seal casts incantations. Nothing in the maths knows that: the
# spell buff is a number, the spell's attack is a number, and multiplying them priced Comet
# cast from an Erdtree Seal at 798.766 — a well-formed figure for a cast that cannot happen.
# Caught by question 3.3 of the validation battery, where a ranking of the best catalysts for
# a Death *sorcery* came back led by a sacred seal.
[[case]]
name = "a seal cannot cast a sorcery"
input = { spell = "Comet", catalyst = "Erdtree Seal", upgrade = 10, strength = 11, dexterity = 10, intelligence = 80, faith = 60, arcane = 10 }
expect_code = 13

[[case]]
name = "and the caller who knows both facts gets a refusal instead"
input = { spell = "Comet", catalyst = "Erdtree Seal", catalyst_class = "Sacred Seal", spell_type = "Sorcery", upgrade = 10, strength = 11, dexterity = 10, intelligence = 80, faith = 60, arcane = 10 }
expect_code = 11

# The Staff of the Great Beyond casts both, which is why the check reads the game's flags
# rather than deciding from the weapon class.
[[case]]
name = "one catalyst casts both, and the flags say so"
input = { spell = "Comet", catalyst = "Staff of the Great Beyond", upgrade = 10, strength = 10, dexterity = 10, intelligence = 80, faith = 10, arcane = 10 }
expect = { "result.catalyst_can_cast_this" = true, "result.catalyst_casts[0]" = "Sorcery", "result.catalyst_casts[1]" = "Incantation" }

# --- spell buffs from the spreadsheet's own saved builds.
#
# Read off the sheet, and the reason the starting class is passed on every one of them: the
# Frenzied Flame Seal on the strength build is 222.87 as a Confessor and 223.30 as a Wretch,
# because that build has 9 intelligence and 9 arcane and planner.py floors both at a Wretch's
# ten. Getting 222.87 out of this node meant admitting the class was doing that.

[[case]]
name = "the sheet's faith build: Erdtree Seal +10 spell buff"
input = { spell = "Black Flame", catalyst = "Erdtree Seal", upgrade = 10, starting_class = "Confessor", strength = 15, dexterity = 24, intelligence = 9, faith = 79, arcane = 9 }
expect = { "result.spell_buff" = 349.645, "result.stats_raised_by_class" = [] }

[[case]]
name = "the sheet's intelligence build: Lusat's +10 spell buff"
input = { spell = "Comet", catalyst = "Lusat's Glintstone Staff", upgrade = 10, starting_class = "Confessor", strength = 12, dexterity = 13, intelligence = 80, faith = 14, arcane = 9 }
expect = { "result.spell_buff" = 413.5, "result.fp_rate" = 1.5, "result.fp_cost_actual" = 36.0 }

[[case]]
name = "Azur's beside it"
input = { spell = "Comet", catalyst = "Azur's Glintstone Staff", upgrade = 10, starting_class = "Confessor", strength = 12, dexterity = 13, intelligence = 80, faith = 14, arcane = 9 }
expect = { "result.spell_buff" = 362.20000000000005, "result.fp_rate" = 1.2 }

[[case]]
name = "and the Frenzied Flame Seal on the same build"
input = { spell = "Black Flame", catalyst = "Frenzied Flame Seal", upgrade = 10, starting_class = "Confessor", strength = 12, dexterity = 13, intelligence = 80, faith = 14, arcane = 9 }
expect = { "result.spell_buff" = 175.910714284 }

# The one that found the bug. Dexterity 17 is the sheet's total — 12 levelled plus Millicent's
# +5 — and the Frenzied Flame Seal is one of the two catalysts whose spell buff takes dexterity.
[[case]]
name = "the strength build's seal, where the starting class is worth 0.43"
input = { spell = "Black Flame", catalyst = "Frenzied Flame Seal", upgrade = 10, starting_class = "Confessor", strength = 79, dexterity = 17, intelligence = 9, faith = 27, arcane = 9 }
expect = { "result.spell_buff" = 222.87142857039998, "result.starting_class" = "Confessor", "result.stats_raised_by_class" = [] }

[[case]]
name = "and as a Wretch it is a different character"
input = { spell = "Black Flame", catalyst = "Frenzied Flame Seal", upgrade = 10, starting_class = "Wretch", strength = 79, dexterity = 17, intelligence = 9, faith = 27, arcane = 9 }
expect = { "result.spell_buff" = 223.2999999994, "result.stats_raised_by_class[0]" = "arcane", "result.stats_raised_by_class[1]" = "intelligence", "result.stats_used.intelligence" = 10 }

# Determinism. The same question twice — once without a class, once with — because the drift
# the battery measured was a model choosing this parameter differently between runs.
[[case]]
name = "no class given falls to the least-distorting one, and says so"
input = { spell = "Comet", catalyst = "Academy Glintstone Staff", upgrade = 25, strength = 10, dexterity = 12, intelligence = 60, faith = 10, arcane = 9 }
expect = { "result.starting_class" = "Wretch", "result.assumed.starting_class" = "Wretch" }

[[case]]
name = "a class the caller gave is never reported as an assumption"
input = { spell = "Comet", catalyst = "Academy Glintstone Staff", upgrade = 25, strength = 10, dexterity = 12, intelligence = 60, faith = 10, arcane = 9, starting_class = "Astrologer" }
expect = { "result.starting_class" = "Astrologer", "result.assumed" = {} }
