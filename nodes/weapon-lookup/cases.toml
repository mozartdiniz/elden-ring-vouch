# Node fixtures (§7.1). Hand-written: this node's answers come from the catalogue, and the
# behaviour worth pinning is what it does when a name does *not* resolve.

[[case]]
name = "an exact name resolves and reports its bounds"
input = { query = "Longsword" }
expect = { "result.resolved" = "Longsword", "result.weapon_class" = "Straight Sword", "result.infusable" = true, "result.max_upgrade" = 25 }

# A somber weapon: caps at +10 and takes no affinity. These two fields are the whole reason
# attack-power can reject an impossible upgrade instead of pricing one.
[[case]]
name = "a somber weapon caps at +10 and takes no affinity"
input = { query = "moonveil" }
expect = { "result.resolved" = "Moonveil", "result.max_upgrade" = 10, "result.infusable" = false }

[[case]]
name = "a weapon that cannot be reinforced caps at +0"
input = { query = "meteorite staff" }
expect = { "result.resolved" = "Meteorite Staff", "result.max_upgrade" = 0 }

[[case]]
name = "a partial name resolves"
input = { query = "ordovis" }
expect = { "result.resolved" = "Ordovis's Greatsword", "result.weapon_class" = "Greatsword", "result.max_upgrade" = 10 }

# Apostrophes and case are normalised away before comparison.
[[case]]
name = "punctuation and case do not matter"
input = { query = "ordoviss greatsword" }
expect = { "result.resolved" = "Ordovis's Greatsword" }

# The case the node exists for: ten weapons contain both words, so nothing resolves and the
# caller has to ask which was meant.
[[case]]
name = "an ambiguous name resolves to nothing and lists the candidates"
input = { query = "knight sword" }
expect = { "result.resolved" = "", "result.ambiguous" = true, "result.match_count" = 10, "result.max_upgrade" = 0, "result.candidates[1]" = "Carian Knight's Sword" }

# An exact name wins outright even though it is a substring of longer names.
[[case]]
name = "an exact name beats the names that contain it"
input = { query = "Greatsword" }
expect = { "result.resolved" = "Greatsword", "result.weapon_class" = "Colossal Sword" }

[[case]]
name = "a class filter narrows an ambiguous query"
input = { query = "katana", weapon_class = "Katana" }
expect = { "result.catalog_size" = 10 }

# Matching nothing is a fact about the catalogue, not an error.
[[case]]
name = "a weapon that is not in the game matches nothing"
input = { query = "buster sword" }
expect = { "result.resolved" = "", "result.match_count" = 0, "result.ambiguous" = false, "result.catalog_size" = 570 }

[[case]]
name = "a query too short to resolve anything is refused"
input = { query = "gs" }
expect_code = 11

[[case]]
name = "a missing query is a caller error, not a refusal"
input = { }
expect_code = 10

# --- what can be put on it.
#
# Pattern 12 asks eight times "is there a way to make this weapon proc that", and the answer is
# three conditions the oracle already checked and nothing exposed: the buff lists the weapon's
# class, the buff lists the affinity, and the weapon can be buffed at all.

# The Marais Executioner's Sword and the Godslayer's Greatsword are the two the battery names,
# and for both the answer is no — not "use a grease", but no. A refusal is the answer.
[[case]]
name = "a unique weapon that takes nothing"
input = { query = "Marais Executioner's Sword" }
expect = { "result.resolved" = "Marais Executioner's Sword", "result.buffable" = false, "result.affinity_asked" = "Standard" }

[[case]]
name = "and another"
input = { query = "Godslayer's Greatsword" }
expect = { "result.buffable" = false }

# The affinity decides it. A Keen Uchigatana takes fifteen buffs; the same weapon infused with
# Blood takes two, because every grease lists only Standard, Heavy, Keen and Quality — so
# Bloodflame Blade on a Blood weapon does not stack, it does not apply.
[[case]]
name = "a keen katana takes the greases"
input = { query = "Uchigatana", affinity = "Keen" }
expect = { "result.buffable" = true, "result.status_buffs_accepted[0]" = "Poison Grease", "result.status_buffs_accepted[1]" = "Rot Grease" }

[[case]]
name = "the same katana infused with Blood takes almost none"
input = { query = "Uchigatana", affinity = "Blood" }
expect = { "result.status_buffs_accepted[0]" = "Seppuku (only bleed; +30 phys AP)", "result.status_buffs_accepted[1]" = "Poisonous Mist" }

# A name that is not in the game is the commonest real input error there is — players
# misremember, and 4.1's "Distinguished Greatsword" is a Distinguished Greatshield. The miss
# is still data, and it now carries the way out of it.
[[case]]
name = "a miss names the node that can recover from it"
input = { query = "Distinguished Greatsword" }
expect = { "result.match_count" = 0, "result.resolved" = "" }

[[case]]
name = "a hit carries no advice"
input = { query = "Uchigatana" }
expect = { "result.try_next" = "" }
