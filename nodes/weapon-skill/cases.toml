# Node fixtures (§7.1). Figures from data/AshAttack.csv and data/AshCompat.csv, both from the
# Prometheux ontology — the Build Planner publishes no skill data.

# The skill from the first real question: "build de Rivers of Blood ... foco em Corpse Piler".
# It does not override the weapon's scaling, so build-allocate's spread does apply — which is
# the useful thing to be able to say.
[[case]]
name = "Corpse Piler is unique to Rivers of Blood and keeps its scaling"
input = { query = "Corpse Piler" }
expect = { "result.skill" = "Corpse Piler", "result.hit_count" = 12, "result.hit_count_lacking_fp" = 6, "result.unique_to[0]" = "Rivers of Blood", "result.any_weapon" = false, "result.overrides_weapon_scaling" = false, "result.highest_motion_value" = 155.0 }

# And the case that matters in the other direction: a skill that replaces the weapon's scaling
# with a single stat, so a spread optimised for the weapon is not one optimised for the skill.
[[case]]
name = "Ground Slam replaces the weapon's scaling with strength"
input = { query = "Ground Slam" }
expect = { "result.skill" = "Ground Slam", "result.overrides_weapon_scaling" = true, "result.scaling_overrides[0]" = "Strength", "result.any_weapon" = true }

[[case]]
name = "a skill's hits carry their own motion and stamina costs"
input = { query = "Corpse Piler" }
expect = { "result.hits[0].hit" = "Corpse Piler #1 [1]", "result.hits[0].motion_value.physical" = 96.0, "result.hits[0].status_motion_value" = 62.0, "result.hits[0].stamina_cost" = 14.0, "result.hits[0].scaling_override" = "-" }

# A skill's variants are separate families, so a bare name resolves to neither rather than
# picking one — the same rule weapons and bosses follow.
[[case]]
name = "a skill with variants is ambiguous"
input = { query = "Transient Moonlight" }
expect = { "result.skill" = "", "result.ambiguous" = true, "result.match_count" = 2, "result.candidates[0]" = "Transient Moonlight R1", "result.candidates[1]" = "Transient Moonlight R2" }

[[case]]
name = "naming the variant resolves it"
input = { query = "Transient Moonlight R1" }
expect = { "result.skill" = "Transient Moonlight R1", "result.unique_to[0]" = "Moonveil" }

[[case]]
name = "a skill that is not in the table matches nothing"
input = { query = "Hadouken" }
expect = { "result.skill" = "", "result.match_count" = 0, "result.hit_count" = 0, "result.ambiguous" = false }

[[case]]
name = "a query too short to resolve anything is refused"
input = { query = "gs" }
expect_code = 11

[[case]]
name = "a missing query is a caller error"
input = { }
expect_code = 10

# Seven families in the table are a name plus " ?" — the source marking a hit it could not
# confirm — and normalising the punctuation away made all seven skills unresolvable: the query
# matched both the real family and its flagged twin and came back ambiguous between a name and
# itself. Loretta's Slash and Establish Order are two of the seven, and both are named in the
# validation battery.
[[case]]
name = "a name is not ambiguous with itself plus a question mark"
input = { query = "Loretta's Slash" }
expect = { "result.skill" = "Loretta's Slash", "result.ambiguous" = false, "result.hit_count" = 2, "result.variant_used" = "", "result.highest_motion_value" = 172.0, "result.uncertain" = false }

[[case]]
name = "and the flagged row is still reachable, and says it is flagged"
input = { query = "Loretta's Slash ?" }
expect = { "result.skill" = "Loretta's Slash ?", "result.hit_count" = 1, "result.highest_motion_value" = 0.0, "result.uncertain" = true }

[[case]]
name = "the Golden Order Greatsword's ash, one of the other six"
input = { query = "Establish Order" }
expect = { "result.skill" = "Establish Order", "result.ambiguous" = false, "result.hit_count" = 5, "result.highest_motion_value" = 300.0, "result.unique_to[0]" = "Golden Order Greatsword", "result.motion_values_uniform" = false }

# A motion value is per damage type, and optimal-affinity's `attack_mv` is one number. Establish
# Order's big hit is 300 holy and 0 physical: handing 300 to the scalar triples a physical
# attack rating the skill does not use. Corpse Piler is uniform and can be passed straight
# through, which is the difference the flag exists to make visible.
[[case]]
name = "a uniform hit can be priced with one motion value"
input = { query = "Corpse Piler" }
expect = { "result.motion_values_uniform" = true, "result.highest_motion_value" = 155.0 }

# A family's rows come in variant groups and they are alternatives, not a sequence. Sword Dance
# carries a set of hits per weapon class, and adding them together made it 48 hits and 4,400
# status motion value where on a reaper it is three hits and 275 — a fact about no weapon.
[[case]]
name = "an ash that hits differently per weapon is reported for one weapon"
input = { query = "Sword Dance", weapon_class = "Reaper" }
expect = { "result.hit_count" = 3, "result.variant_used" = "Reaper", "result.highest_motion_value" = 155.0 }

[[case]]
name = "and without a class it says which variant it chose"
input = { query = "Sword Dance" }
expect = { "result.hit_count" = 3, "result.variant_used" = "Axe", "result.highest_motion_value" = 150.0 }

# "Does this ash take Blood?" is not what `default_affinity` answers — that is only the affinity
# it arrives with. Spinning Slash comes as Keen and accepts all thirteen, which is the answer to
# question 6.6's "Spinning Slash não serve?".
[[case]]
name = "the affinities an ash accepts are not the one it comes with"
input = { query = "Spinning Slash" }
expect = { "result.default_affinity" = "Keen", "result.affinities[0]" = "Blood", "result.affinities[1]" = "Cold" }

# An ash that deals no damage has no rows in the hit table and used to resolve to nothing at
# all. Seppuku is a self-buff, question 6.2 names it beside two ashes that do hit, and "it has
# no damaging hits, and it takes these affinities" is the answer.
[[case]]
name = "an ash with no damaging hits still resolves"
input = { query = "Seppuku" }
expect = { "result.skill" = "Seppuku", "result.hit_count" = 0, "result.affinities[0]" = "Blood", "result.affinities[1]" = "Heavy", "result.affinities[2]" = "Keen", "result.default_affinity" = "Blood" }
